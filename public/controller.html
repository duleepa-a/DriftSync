<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#080e13" />
  <title>Burnout — Controller</title>
  <link rel="stylesheet" href="css/controller.css" />
  <link rel="stylesheet" href="css/interface-theme.css" />
</head>
<body>
  <!-- Join screen -->
  <section id="join" class="screen">
    <div class="card">
      <h1>Controller</h1>
      <p>Enter the four-character code shown on the game screen.</p>
      <input id="codeInput" maxlength="4" autocapitalize="characters" autocomplete="off"
             inputmode="text" placeholder="CODE" />
      <input id="nameInput" maxlength="10" autocomplete="off" placeholder="Your name (optional)" />
      <button id="joinBtn">Join game</button>
      <div id="joinError" class="error"></div>
    </div>
  </section>

  <!-- Active controller -->
  <section id="controller" class="screen hidden">
    <div id="statusBar">
      <span id="placeBadge">P1</span>
      <span id="lapBadge">Lap 1/3</span>
      <span id="speedBadge">0 mph</span>
    </div>

    <div id="drivePad">
      <button id="leftBtn" class="drive steer left" type="button" aria-label="Steer left">
        <span class="drive-content"><span class="chevron" aria-hidden="true">❮</span><small>LEFT</small></span>
      </button>
      <button id="brakeBtn" class="drive brake" type="button" aria-label="Brake or reverse">
        <span class="drive-content"><strong>BRAKE / REV</strong><small>HOLD TO SLOW</small></span>
      </button>
      <button id="rightBtn" class="drive steer right" type="button" aria-label="Steer right">
        <span class="drive-content"><span class="chevron" aria-hidden="true">❯</span><small>RIGHT</small></span>
      </button>
    </div>

    <div id="autoHint">Auto-accelerating · steer with <span class="chevron" aria-hidden="true">❮</span><span class="chevron" aria-hidden="true">❯</span> hold BRAKE to slow / reverse</div>
  </section>

  <div id="fullscreenPrompt" class="fullscreen-prompt hidden">
    <div class="fullscreen-card">
      <p id="fullscreenMessage">The race is starting. Tap to use the full screen.</p>
      <button id="fullscreenBtn" type="button">Play fullscreen</button>
    </div>
  </div>

  <div id="lostBanner" class="banner hidden">Disconnected. <a href="">Rejoin</a></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
